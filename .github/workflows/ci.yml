# CI for the standalone kmp-bugreport repository. This file lives in CarGuy's bugreport/ directory
# and reaches the mirror through scripts/sync-bugreport-mirror.sh; GitHub ignores it inside CarGuy.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JVM tests, Android and web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # The shared tests run on the JVM; the browser runners are disabled (see the module build),
      # so the web targets are compiled rather than tested.
      - name: Test and compile
        run: ./gradlew jvmTest compileAndroidMain compileKotlinWasmJs compileKotlinJs

      - name: Build the sample apps
        run: ./gradlew :sample:compileKotlinJvm :sample:compileKotlinWasmJs :sample-android:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '*/build/reports/tests/'
          if-no-files-found: ignore
          retention-days: 14

  ios:
    name: iOS
    # Kotlin/Native Apple targets only build on macOS.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile iOS
        run: ./gradlew compileKotlinIosArm64 compileKotlinIosSimulatorArm64
